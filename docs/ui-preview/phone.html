<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>BulletChat UI</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #06080D; }
  body {
    width: 393px; height: 852px; overflow: hidden;
    font-family: "Noto Sans CJK SC", "Noto Sans", sans-serif;
    color: #F3F7FC;
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    position: relative; width: 393px; height: 852px; overflow: hidden;
    background:
      radial-gradient(85% 85% at 88% 2%, rgba(95,227,243,.30) 0%, rgba(95,227,243,.08) 45%, rgba(95,227,243,0) 100%),
      radial-gradient(80% 80% at 2% 58%, rgba(139,124,255,.24) 0%, rgba(139,124,255,.06) 42%, rgba(139,124,255,0) 100%),
      linear-gradient(160deg, #0B1524 0%, #08101B 45%, #06080D 78%);
  }
  .page { display: none; position: absolute; inset: 0; }
  .page.active { display: block; }

  /* 状态栏 */
  .status {
    height: 24px; display: flex; align-items: center; justify-content: space-between;
    padding: 2px 22px 0; font-size: 11px; font-weight: 700; letter-spacing: .2px;
  }
  .status .icons { display: flex; align-items: center; gap: 5px; }
  .bars { display: flex; align-items: flex-end; gap: 1.5px; }
  .bars i { display: block; width: 2.5px; background: #F3F7FC; border-radius: 1px; }
  .bars i:nth-child(1){height:4px} .bars i:nth-child(2){height:6px}
  .bars i:nth-child(3){height:8px} .bars i:nth-child(4){height:10px}
  .wifi { width: 13px; height: 9px; }
  .batt { width: 21px; height: 10px; border: 1.2px solid rgba(243,247,252,.85); border-radius: 3px; padding: 1px; }
  .batt span { display: block; height: 100%; width: 72%; background: #F3F7FC; border-radius: 1px; }

  .content { position: absolute; top: 24px; left: 0; right: 0; bottom: 120px; padding: 18px 20px 0; overflow: hidden; }

  .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: #5FE3F3; }
  h1 { margin: 8px 0 0; font-size: 30px; line-height: 1.16; font-weight: 700; letter-spacing: -0.6px; }
  .sub { margin-top: 7px; font-size: 12px; color: #6B7C91; }

  .card { border-radius: 24px; background: rgba(13,23,37,.86); border: 1px solid rgba(255,255,255,.12); }
  .section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.6px; color: #6B7C91; margin: 20px 0 9px 4px; }

  /* 主页 */
  .hero {
    margin-top: 20px; border-radius: 26px; padding: 18px 20px 20px;
    background: linear-gradient(135deg, #12303F 0%, #111C33 55%, #191A38 100%);
  }
  .status-row { display: flex; align-items: center; font-size: 12px; color: #A3B2C6; }
  .dot { font-size: 9px; color: #3DDC97; margin-right: 6px; }
  .time-big { font-size: 44px; font-weight: 300; letter-spacing: -1.3px; margin-top: 14px; }
  .time-cap { font-size: 11px; color: #6B7C91; letter-spacing: .4px; margin-top: 2px; }
  .hero p { margin: 14px 0 0; font-size: 11px; color: #A3B2C6; line-height: 1.35; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .metric { border-radius: 20px; background: rgba(13,23,37,.72); border: 1px solid rgba(255,255,255,.08); padding: 14px 16px 15px; }
  .metric .label { display: flex; align-items: center; font-size: 11px; color: #6B7C91; }
  .metric .label b { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .metric .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-top: 9px; }

  .recent { margin-top: 12px; padding: 16px 18px; }
  .recent .head { display: flex; justify-content: space-between; align-items: center; }
  .recent .app { margin-top: 12px; font-size: 13px; font-weight: 700; }
  .recent .title { margin-top: 4px; font-size: 11px; color: #5FE3F3; }
  .recent .text { margin-top: 7px; font-size: 12px; color: #A3B2C6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .tip { margin-top: 12px; padding: 14px 16px; border-radius: 20px; display: flex;
    background: rgba(255,196,112,.08); border: 1px solid rgba(255,196,112,.20); }
  .tip b { font-size: 11px; color: #FFC470; }
  .tip span { font-size: 11px; color: #6B7C91; margin-left: 10px; line-height: 1.3; }

  /* 底部导航 */
  .nav { position: absolute; left: 14px; right: 14px; bottom: 30px; height: 88px; }
  .nav-base { position: absolute; left: 0; right: 0; bottom: 4px; height: 64px; border-radius: 30px;
    background: rgba(10,20,32,.95); border: 1px solid rgba(255,255,255,.15); }
  .nav-items { position: absolute; left: 0; right: 0; bottom: 4px; height: 64px; display: flex; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .nav-item .cap { font-size: 10px; font-weight: 700; letter-spacing: .4px; margin-top: 5px; }
  .nav-item.on .cap { color: #5FE3F3; }
  .nav-item.off .cap { color: #6B7C91; }
  .fab { position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(95,227,243,.13); border: 1px solid rgba(95,227,243,.53);
    box-shadow: 0 8px 22px rgba(0,0,0,.55), 0 0 18px rgba(95,227,243,.22); }
  .fab .core { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6EE9F7 0%, #63C8FF 55%, #8B7CFF 100%); }

  /* 启动页 */
  .btn-holder { height: 240px; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
  .launch-btn { position: relative; width: 232px; height: 232px; display: flex; align-items: center; justify-content: center; }
  .halo { position: absolute; width: 186px; height: 186px; border-radius: 50%; background: rgba(95,227,243,.18); }
  .ring1 { position: absolute; width: 209px; height: 209px; border-radius: 50%; border: 1px solid rgba(95,227,243,.40); }
  .ring2 { position: absolute; width: 167px; height: 167px; border-radius: 50%; border: 1px solid rgba(95,227,243,.34); }
  .core-big { position: relative; width: 144px; height: 144px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #6EE9F7 0%, #5BB8FF 50%, #8B7CFF 100%);
    box-shadow: 0 14px 42px rgba(95,227,243,.32); }
  .state-title { text-align: center; font-size: 20px; font-weight: 700; }
  .state-sub { text-align: center; font-size: 12px; color: #6B7C91; margin-top: 8px; line-height: 1.3; }

  .strip { margin-top: 22px; border-radius: 22px; padding: 15px 18px; display: flex;
    background: rgba(13,23,37,.86); border: 1px solid rgba(255,255,255,.12); }
  .strip .col { flex: 1; text-align: center; }
  .strip .num { font-size: 22px; font-weight: 700; }
  .strip .cap { font-size: 10px; color: #6B7C91; margin-top: 5px; }
  .vline { width: 1px; height: 34px; background: rgba(255,255,255,.10); }

  .perm-card { margin-top: 12px; padding: 4px 18px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; }
  .row .t { font-size: 14px; }
  .row .s { font-size: 11px; color: #6B7C91; margin-top: 4px; line-height: 1.15; }
  .row .v { font-size: 12px; font-weight: 700; color: #5FE3F3; display: flex; align-items: center; gap: 2px; }
  .row .v.ok { color: #3DDC97; }
  .divider { height: 1px; background: rgba(255,255,255,.08); }

  .hint { margin-top: 12px; padding: 14px 16px; border-radius: 20px;
    background: rgba(23,196,196,.08); border: 1px solid rgba(95,227,243,.12); }
  .hint .t { font-size: 12px; color: #5FE3F3; font-weight: 700; }
  .hint .b { font-size: 11px; color: #6B7C91; margin-top: 6px; line-height: 1.35; }

  /* 设置页 */
  .set-card { padding: 4px 18px; }
  .tg { width: 44px; height: 26px; border-radius: 13px; position: relative; flex: none; }
  .tg.off { background: #25313F; }
  .tg.on { background: #5FE3F3; }
  .tg i { position: absolute; top: 2px; width: 20px; height: 20px; border-radius: 50%; display: block; }
  .tg.on i { right: 2px; background: #FFFFFF; }
  .tg.off i { left: 2px; background: #8A97A6; }
  .tg.dim { opacity: .42; }

  .slider { padding: 15px 0 6px; }
  .slider .top { display: flex; justify-content: space-between; align-items: center; }
  .slider .name { font-size: 13px; color: #A3B2C6; }
  .slider .val { font-size: 12px; font-weight: 700; color: #5FE3F3; }
  .track { margin-top: 12px; height: 3px; border-radius: 2px; background: #202C3B; position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: #5FE3F3; }
  .knob { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #5FE3F3;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 4px rgba(95,227,243,.14); }

  .kw { margin: 11px 0 12px; padding: 12px 14px; border-radius: 14px; min-height: 54px;
    background: #132030; border: 1px solid rgba(255,255,255,.08); font-size: 14px; color: #5A6A7E; }

  /* 弹幕演示 */
  .chat { position: absolute; inset: 0; background: #111315; }
  .chat .top { height: 52px; display: flex; align-items: center; padding: 0 16px;
    background: #1A1C1F; border-bottom: 1px solid rgba(255,255,255,.05); }
  .chat .top .back { width: 20px; height: 20px; margin-right: 8px; display: flex; }
  .chat .top .name { font-size: 15px; color: #E6E8EA; }
  .chat .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 13px; }
  .stamp { text-align: center; font-size: 11px; color: #5A5F66; margin-bottom: 2px; }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.me { justify-content: flex-end; }
  .avatar { width: 32px; height: 32px; border-radius: 5px; flex: none;
    background: linear-gradient(135deg,#4C7A5A,#2F4B39); }
  .avatar.b { background: linear-gradient(135deg,#3C5A7A,#26374B); }
  .bubble { background: #23262A; border-radius: 7px; padding: 9px 11px; font-size: 14px;
    line-height: 1.45; color: #E6E8EA; max-width: 232px; }
  .msg.me .bubble { background: #2A5A3C; }
  .inputbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #1A1C1F;
    border-top: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; padding: 0 14px; }
  .field { flex: 1; height: 34px; border-radius: 8px; background: #23262A; color: #6A7078;
    font-size: 13px; display: flex; align-items: center; padding: 0 12px; }

  .danmaku-band { position: absolute; left: 0; right: 0; top: 436px; height: 200px; }
  .dan { position: absolute; display: flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-radius: 15px; background: rgba(6,11,19,.93); font-size: 16px; font-weight: 700;
    white-space: nowrap; color: #fff; box-shadow: 0 5px 16px rgba(0,0,0,.55); }
  .dan .ic { width: 17px; height: 17px; border-radius: 4px; flex: none; }
  .ic.wx { background: linear-gradient(135deg,#4ECB71,#22A45D); }
  .ic.qq { background: linear-gradient(135deg,#63B8FF,#2E7BE0); }
</style>
</head>
<body>
<div class="phone" id="phone"></div>

<script>
const icons = {
  home: '<svg width="21" height="21" viewBox="0 0 24 24"><path fill="CUR" d="M12,3.2L2.8,11.3c-0.4,0.35 -0.15,1 0.38,1h1.82v7.4c0,0.6 0.5,1.1 1.1,1.1h4.1v-6.1h3.6v6.1h4.1c0.6,0 1.1,-0.5 1.1,-1.1v-7.4h1.82c0.53,0 0.78,-0.65 0.38,-1L12,3.2z"/></svg>',
  gear: '<svg width="21" height="21" viewBox="0 0 24 24"><path fill="CUR" d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>',

function ic(name, color) { return icons[name].replace('CUR', color || '#5FE3F3'); }

const statusBar = `
  <div class="status">
    <div>21:36</div>
    <div class="icons">
      <div class="bars"><i></i><i></i><i></i><i></i></div>
      <svg class="wifi" viewBox="0 0 24 24"><path fill="#F3F7FC" d="M12,18.5a1.7,1.7 0 1 1 0,3.4a1.7,1.7 0 0,1 0,-3.4zM12,13.6c1.9,0 3.6,0.7 4.9,1.9l-1.7,1.7a4.9,4.9 0 0 0 -6.4,0L7.1,15.5c1.3,-1.2 3,-1.9 4.9,-1.9zM12,8.6c3.3,0 6.3,1.3 8.5,3.4l-1.7,1.7A9.6,9.6 0 0 0 12,10.9c-2.6,0 -5,1 -6.8,2.8L3.5,12A11.9,11.9 0 0 1 12,8.6zM12,3.6c4.7,0 8.9,1.9 12,4.9l-1.7,1.7A14.4,14.4 0 0 0 12,5.9c-4,0 -7.6,1.6 -10.3,4.3L0,8.5A16.9,16.9 0 0 1 12,3.6z"/></svg>

      <div class="nav-item ${active===2?'on':'off'}">

    </div>
    <div class="fab"><div class="core">${ic('stop')}</div></div>
  </div>`;
}

const home = `

const settings = `
<div class="page" data-screen="settings">
